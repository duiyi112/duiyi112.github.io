<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智能便签 - 粘贴自动记录日期，支持快递信息识别、高级筛选与编辑">
    <title>📝 智能便签 · 可编辑</title>
    <style>
        :root {
            --bg-page: #f3f3f3;
            --bg-surface: #fcfcfc;
            --bg-card: #ffffff;
            --bg-input: #f9f9f9;
            --bg-hover: #f5f5f5;
            --bg-accent-light: #e8f4fd;
            --text-primary: #1a1a1a;
            --text-secondary: #5a5a5a;
            --text-tertiary: #888888;
            --text-date: #5c7fa8;
            --text-tag: #2c6e4f;
            --border-color: #e0e0e0;
            --border-focus: #60a5fa;
            --accent: #0067c0;
            --accent-hover: #005299;
            --accent-pressed: #004080;
            --danger: #c42b1c;
            --danger-hover: #a12014;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12), 0 4px 8px rgba(0, 0, 0, 0.06);
            --shadow-input: 0 0 0 3px rgba(96, 165, 250, 0.25);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --font-family: 'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui,
                -apple-system, sans-serif;
            --font-mono: 'Cascadia Code', 'Consolas', 'SF Mono', 'Monaco', 'Menlo', monospace;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #1e1e1e;
                --bg-surface: #282828;
                --bg-card: #2d2d2d;
                --bg-input: #333333;
                --bg-hover: #383838;
                --bg-accent-light: #1a3040;
                --text-primary: #e8e8e8;
                --text-secondary: #b0b0b0;
                --text-tertiary: #808080;
                --text-date: #8ab4d8;
                --text-tag: #4da385;
                --border-color: #3d3d3d;
                --border-focus: #60a5fa;
                --accent: #4da3e0;
                --accent-hover: #3b8dc7;
                --accent-pressed: #2d74a8;
                --danger: #e04f3f;
                --danger-hover: #c43a2c;
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
                --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35), 0 2px 4px rgba(0, 0, 0, 0.25);
                --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4), 0 4px 8px rgba(0, 0, 0, 0.3);
                --shadow-input: 0 0 0 3px rgba(96, 165, 250, 0.35);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(0, 103, 192, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(0, 103, 192, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .app-container {
            width: 100%;
            max-width: 780px;
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            max-height: 94vh;
            border: 1px solid var(--border-color);
        }

        .app-header {
            padding: 16px 24px 10px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .app-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .app-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .app-title .icon {
            font-size: 1.5rem;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--bg-accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-hover);
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .badge-count strong { color: var(--accent); }

        .search-wrapper { position: relative; margin-bottom: 8px; }
        .search-input {
            width: 100%;
            padding: 9px 42px 9px 38px;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: 0.15s;
        }
        .search-input:focus {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-input);
        }
        .search-icon {
            position: absolute; left: 13px; top: 50%;
            transform: translateY(-50%); color: var(--text-tertiary);
        }
        .search-clear {
            position: absolute; right: 10px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; font-size: 1.1rem;
            color: var(--text-tertiary); padding: 4px 8px;
            border-radius: 50%; display: none; cursor: pointer;
        }
        .search-clear.visible { display: block; }
        .search-clear:hover { background: var(--bg-hover); }

        .filter-toggle-row { display: flex; align-items: center; justify-content: space-between; }
        .btn-filter-toggle {
            background: transparent; border: 1px solid var(--border-color);
            padding: 5px 14px; border-radius: 20px; font-size: 0.78rem;
            color: var(--text-secondary); cursor: pointer; transition: 0.15s;
        }
        .btn-filter-toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .filter-panel {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 12px 14px;
            margin-top: 8px; display: none; flex-wrap: wrap; gap: 10px;
        }
        .filter-panel.show { display: flex; }
        .filter-group {
            display: flex; align-items: center; gap: 6px; font-size: 0.82rem;
            flex: 1 1 160px;
        }
        .filter-group input {
            flex: 1; padding: 6px 8px; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); background: var(--bg-input);
            color: var(--text-primary); font-size: 0.82rem;
        }
        .filter-actions { display: flex; gap: 6px; }
        .btn-filter-action {
            font-size: 0.75rem; padding: 6px 12px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-color); background: var(--bg-input);
            cursor: pointer;
        }
        .btn-filter-action.apply { background: var(--accent); color: white; }

        .input-section { padding: 14px 24px; border-bottom: 1px solid var(--border-color); }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-textarea {
            flex: 1; padding: 10px 14px; font-size: 0.95rem;
            border: 1.5px solid var(--border-color); border-radius: var(--radius-lg);
            background: var(--bg-input); color: var(--text-primary);
            resize: none; min-height: 46px; max-height: 140px;
            transition: 0.15s;
        }
        .input-textarea:focus {
            border-color: var(--border-focus); box-shadow: var(--shadow-input);
        }
        .btn-add {
            padding: 10px 20px; font-size: 0.9rem; font-weight: 600;
            background: var(--accent); color: #fff; border: none;
            border-radius: var(--radius-lg); cursor: pointer; white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,103,192,0.2); height: 46px;
        }
        .btn-add:hover { background: var(--accent-hover); }

        .toolbar {
            display: flex; justify-content: space-between; padding: 8px 24px;
            border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .toolbar-info { font-size: 0.8rem; color: var(--text-secondary); }

        .notes-list {
            flex: 1; overflow-y: auto; padding: 12px 20px 20px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .note-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 12px 16px;
            box-shadow: var(--shadow-sm); transition: 0.25s;
            display: flex; gap: 12px; align-items: flex-start;
        }
        .note-card.editing {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-input);
        }
        .note-index {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--bg-accent-light); display: flex;
            align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700; color: var(--accent);
            flex-shrink: 0; margin-top: 2px;
        }
        .note-body { flex: 1; min-width: 0; }
        .note-content { font-size: 0.9rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; margin-bottom: 6px; }
        .info-line { display: block; margin-bottom: 2px; }
        .info-label { font-weight: 600; color: var(--text-tag); margin-right: 6px; }
        .note-date-tag {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.75rem; color: var(--text-date);
            background: var(--bg-accent-light); padding: 3px 10px; border-radius: 16px;
        }
        .note-actions { display: flex; gap: 4px; opacity: 0; transition: 0.15s; align-self: center; }
        .note-card:hover .note-actions { opacity: 1; }
        @media (hover: none) { .note-actions { opacity: 1; } }
        .btn-icon {
            width: 30px; height: 30px; border-radius: 50%; border: none;
            background: transparent; cursor: pointer; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-tertiary);
        }
        .btn-icon:hover { background: var(--bg-hover); }
        .btn-icon.edit:hover { color: var(--accent); }
        .btn-icon.delete:hover { color: var(--danger); }

        .edit-area {
            display: flex; flex-direction: column; gap: 8px;
        }
        .edit-textarea {
            width: 100%; min-height: 80px; padding: 10px;
            font-size: 0.9rem; border: 1px solid var(--border-color);
            border-radius: var(--radius-md); background: var(--bg-input);
            color: var(--text-primary); resize: vertical;
        }
        .edit-buttons { display: flex; gap: 6px; justify-content: flex-end; }
        .btn-edit-action {
            padding: 5px 14px; border-radius: var(--radius-sm);
            font-size: 0.8rem; border: 1px solid var(--border-color);
            background: var(--bg-card); cursor: pointer;
        }
        .btn-edit-action.save { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-edit-action.cancel { color: var(--text-secondary); }

        .empty-state, .no-results {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 40px 20px; text-align: center;
            color: var(--text-tertiary); gap: 8px;
        }
        .empty-icon { font-size: 3rem; opacity: 0.5; }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1a1a; color: #fff; padding: 10px 20px;
            border-radius: 24px; font-size: 0.85rem; z-index: 1000;
            transition: transform 0.35s; box-shadow: var(--shadow-lg);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: #0f7a3c; }

        @media (max-width: 640px) {
            body { padding: 6px; }
            .app-container { max-height: 98vh; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <div class="app-title-row">
            <h1 class="app-title"><span class="icon">📦</span>发货记录</h1>
            <span class="badge-count">共 <strong id="totalCount">0</strong> 条</span>
        </div>
        <div class="search-wrapper">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 全局搜索" autocomplete="off">
            <span class="search-icon">🔍</span>
            <button class="search-clear" id="searchClear">✕</button>
        </div>
        <div class="filter-toggle-row">
            <button class="btn-filter-toggle" id="btnToggleFilter">⚙️ 筛选 <span id="filterActiveDot" style="display:none;">●</span></button>
            <span style="font-size:0.7rem; color:var(--text-tertiary);" id="filterSummary"></span>
        </div>
        <div class="filter-panel" id="filterPanel">
            <div class="filter-group"><label>📅 从</label><input type="date" id="filterDateFrom"></div>
            <div class="filter-group"><label>📅 到</label><input type="date" id="filterDateTo"></div>
            <div class="filter-group"><label>👤 买家</label><input type="text" id="filterBuyer" placeholder="关键词"></div>
            <div class="filter-group"><label>📦 订单号</label><input type="text" id="filterOrder" placeholder="订单号"></div>
            <div class="filter-group"><label>🏪 平台</label><input type="text" id="filterPlatform" placeholder="平台"></div>
            <div class="filter-actions">
                <button class="btn-filter-action apply" id="btnApplyFilter">应用</button>
                <button class="btn-filter-action clear" id="btnClearFilter">清除</button>
            </div>
        </div>
    </header>

    <section class="input-section">
        <div class="input-row">
            <textarea class="input-textarea" id="noteInput" placeholder="粘贴或输入… Shift+Enter换行 ctrl+v创建空记录" rows="1"></textarea>
            <button class="btn-add" id="btnAdd">＋ 添加</button>
        </div>
    </section>

    <div class="toolbar">
        <span class="toolbar-info">显示 <strong id="filteredCount">0</strong> 条</span>
        <button class="btn-tool danger" id="btnClearAll">🗑 清空全部</button>
    </div>

    <div class="notes-list" id="notesList"></div>
    <div class="toast" id="toast"></div>
</div>

<script>
    (function() {
        const notesList = document.getElementById('notesList');
        const noteInput = document.getElementById('noteInput');
        const btnAdd = document.getElementById('btnAdd');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const btnClearAll = document.getElementById('btnClearAll');
        const totalCount = document.getElementById('totalCount');
        const filteredCount = document.getElementById('filteredCount');
        const toast = document.getElementById('toast');

        const btnToggleFilter = document.getElementById('btnToggleFilter');
        const filterPanel = document.getElementById('filterPanel');
        const filterDateFrom = document.getElementById('filterDateFrom');
        const filterDateTo = document.getElementById('filterDateTo');
        const filterBuyer = document.getElementById('filterBuyer');
        const filterOrder = document.getElementById('filterOrder');
        const filterPlatform = document.getElementById('filterPlatform');
        const btnApplyFilter = document.getElementById('btnApplyFilter');
        const btnClearFilter = document.getElementById('btnClearFilter');
        const filterActiveDot = document.getElementById('filterActiveDot');
        const filterSummary = document.getElementById('filterSummary');

        const STORAGE_KEY = 'sticky_notes_edit_v3';
        let notes = [];
        let toastTimer = null;
        let activeFilters = { dateFrom:'', dateTo:'', buyer:'', order:'', platform:'' };

        function loadNotes() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                notes = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(notes)) notes = [];
                notes = notes.filter(n => n && n.id);
            } catch(e) { notes = []; }
            notes.sort((a,b) => (b.createdAt || b.id) - (a.createdAt || a.id));
        }

        function saveNotes() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch(e) {}
        }

        function getCurrentDateString() {
            return new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', timeZone:'Asia/Shanghai' });
        }

        function parseShippingInfo(text) {
            const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
            if (lines.length < 4) return null;
            return `平台: ${lines[0]}\n买家: ${lines[lines.length-2]}\n订单: ${lines[1]}\n快递: ${lines[lines.length-1]}`;
        }

        function extractField(note, field) {
            if (!note.isAutoFormatted) return '';
            const lines = note.content.split('\n');
            for (let line of lines) {
                if (line.startsWith(field+':')) return line.substring(field.length+1).trim();
            }
            return '';
        }

        function addNote(content) {
            const trimmed = content.trim();
            if (!trimmed) return false;
            const formatted = parseShippingInfo(trimmed);
            const note = {
                id: Date.now(),
                content: formatted || trimmed,
                date: getCurrentDateString(),
                createdAt: Date.now(),
                isAutoFormatted: !!formatted,
            };
            notes.unshift(note);
            saveNotes();
            return note;
        }

        function updateNote(id, newContent) {
            const note = notes.find(n => n.id === id);
            if (!note) return false;
            const formatted = parseShippingInfo(newContent.trim());
            note.content = formatted || newContent.trim();
            note.isAutoFormatted = !!formatted;
            note.date = getCurrentDateString(); // 更新日期为修改时间
            saveNotes();
            return true;
        }

        function deleteNote(id) {
            const idx = notes.findIndex(n => n.id === id);
            if (idx === -1) return false;
            notes.splice(idx,1);
            saveNotes();
            return true;
        }

        function applyFilters(noteList) {
            const f = activeFilters;
            return noteList.filter(note => {
                if (f.dateFrom || f.dateTo) {
                    const noteDate = new Date(note.createdAt);
                    const dateStr = noteDate.toISOString().split('T')[0];
                    if (f.dateFrom && dateStr < f.dateFrom) return false;
                    if (f.dateTo && dateStr > f.dateTo) return false;
                }
                if (f.buyer) {
                    const buyer = extractField(note, '买家');
                    if (!buyer.toLowerCase().includes(f.buyer.toLowerCase())) return false;
                }
                if (f.order) {
                    const order = extractField(note, '订单');
                    if (!order.toLowerCase().includes(f.order.toLowerCase())) return false;
                }
                if (f.platform) {
                    const plat = extractField(note, '平台');
                    if (!plat.toLowerCase().includes(f.platform.toLowerCase())) return false;
                }
                return true;
            });
        }

        function getFilteredNotes() {
            let result = applyFilters(notes);
            const query = searchInput.value.trim().toLowerCase();
            if (query) result = result.filter(n => n.content.toLowerCase().includes(query) || n.date.toLowerCase().includes(query));
            return result;
        }

        function updateFilterUI() {
            const has = activeFilters.dateFrom || activeFilters.dateTo || activeFilters.buyer || activeFilters.order || activeFilters.platform;
            filterActiveDot.style.display = has ? 'inline' : 'none';
            filterSummary.textContent = has ? '筛选已激活' : '';
        }

        // ---------- 渲染 ----------
        function renderNotes() {
            const displayNotes = getFilteredNotes();
            notesList.innerHTML = '';
            totalCount.textContent = notes.length;
            filteredCount.textContent = displayNotes.length;

            if (displayNotes.length === 0) {
                notesList.innerHTML = notes.length === 0 ?
                    `<div class="empty-state"><span class="empty-icon">📋</span>暂无便签</div>` :
                    `<div class="no-results"><span class="empty-icon">🔍</span>无匹配结果</div>`;
                return;
            }

            displayNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.setAttribute('data-id', note.id);
                const globalIndex = notes.findIndex(n => n.id === note.id) + 1;

                let contentHtml = '';
                if (note.isAutoFormatted) {
                    contentHtml = note.content.split('\n').map(line => {
                        const ci = line.indexOf(':');
                        if (ci > 0) {
                            return `<span class="info-line"><span class="info-label">${escHtml(line.substring(0,ci+1))}</span>${escHtml(line.substring(ci+1))}</span>`;
                        }
                        return escHtml(line);
                    }).join('');
                } else {
                    contentHtml = escHtml(note.content).replace(/\n/g, '<br>');
                }

                card.innerHTML = `
                    <div class="note-index">${globalIndex}</div>
                    <div class="note-body">
                        <div class="note-content">${contentHtml}</div>
                        <span class="note-date-tag">📅 ${escHtml(note.date)}</span>
                    </div>
                    <div class="note-actions">
                        <button class="btn-icon edit" data-id="${note.id}">✏️</button>
                        <button class="btn-icon copy" data-id="${note.id}">📋</button>
                        <button class="btn-icon delete" data-id="${note.id}">🗑</button>
                    </div>`;
                notesList.appendChild(card);
            });

            bindCardEvents();
            updateFilterUI();
        }

        function bindCardEvents() {
            // 编辑按钮
            notesList.querySelectorAll('.btn-icon.edit').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    startEdit(id);
                };
            });
            // 复制
            notesList.querySelectorAll('.btn-icon.copy').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const note = notes.find(n => n.id === parseInt(btn.dataset.id));
                    if (note) copyToClipboard(note.content);
                };
            });
            // 删除
            notesList.querySelectorAll('.btn-icon.delete').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    confirmAndDelete(id, btn);
                };
            });
        }

        function startEdit(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            const card = notesList.querySelector(`[data-id="${id}"]`);
            if (!card) return;
            card.classList.add('editing');
            const body = card.querySelector('.note-body');
            const originalContent = note.content;
            body.innerHTML = `
                <div class="edit-area">
                    <textarea class="edit-textarea">${escHtml(originalContent)}</textarea>
                    <div class="edit-buttons">
                        <button class="btn-edit-action save">保存</button>
                        <button class="btn-edit-action cancel">取消</button>
                    </div>
                </div>`;
            const textarea = body.querySelector('.edit-textarea');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);

            const saveBtn = body.querySelector('.save');
            const cancelBtn = body.querySelector('.cancel');

            saveBtn.onclick = () => {
                const newContent = textarea.value;
                if (newContent.trim() === '') {
                    showToast('内容不能为空', false);
                    return;
                }
                updateNote(id, newContent);
                renderNotes();
                showToast('✅ 已保存', true);
            };

            cancelBtn.onclick = () => {
                renderNotes();
            };

            // 支持 Ctrl+Enter 快速保存
            textarea.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    saveBtn.click();
                }
            });
        }

        function confirmAndDelete(id, btnEl) {
            const card = btnEl.closest('.note-card');
            if (card) {
                card.style.opacity = '0'; card.style.transform = 'translateX(30px)';
                setTimeout(() => {
                    if (deleteNote(id)) renderNotes();
                }, 200);
            } else {
                if (deleteNote(id)) renderNotes();
            }
        }

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function copyToClipboard(text) {
            navigator.clipboard?.writeText(text).then(()=>showToast('📋 已复制',true)).catch(()=>{
                const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                showToast('📋 已复制',true);
            });
        }
        function showToast(msg, success=false) {
            clearTimeout(toastTimer);
            toast.textContent=msg; toast.className='toast'+(success?' success':'');
            toast.classList.add('show');
            toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
        }

        // 事件绑定
        btnAdd.onclick = () => {
            const text = noteInput.value;
            if (text.trim()) {
                if (addNote(text.trim())) {
                    noteInput.value = ''; noteInput.style.height = 'auto';
                    searchInput.value = ''; searchClear.classList.remove('visible');
                    renderNotes();
                    showToast(notes[0]?.isAutoFormatted?'✅ 快递已整理':'✅ 已添加',true);
                }
            }
        };
        noteInput.addEventListener('keydown', (e) => {
            if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); btnAdd.click(); }
        });
        searchInput.addEventListener('input', () => {
            searchClear.classList.toggle('visible', searchInput.value.length>0);
            renderNotes();
        });
        searchClear.onclick = () => { searchInput.value=''; searchClear.classList.remove('visible'); renderNotes(); };
        btnClearAll.onclick = () => {
            if (notes.length && confirm('清空所有便签？')) { notes=[]; saveNotes(); renderNotes(); showToast('已清空',true); }
        };

        document.addEventListener('paste', (e) => {
            if (document.activeElement===noteInput || document.activeElement===searchInput) return;
            const text = e.clipboardData?.getData('text/plain');
            if (!text?.trim()) return;
            e.preventDefault();
            if (addNote(text.trim())) {
                searchInput.value=''; searchClear.classList.remove('visible');
                renderNotes();
                showToast(notes[0]?.isAutoFormatted?'📦 已整理':'✅ 已创建',true);
            }
        });

        btnToggleFilter.onclick = () => {
            filterPanel.classList.toggle('show');
            btnToggleFilter.classList.toggle('active', filterPanel.classList.contains('show'));
        };
        btnApplyFilter.onclick = () => {
            activeFilters.dateFrom=filterDateFrom.value;
            activeFilters.dateTo=filterDateTo.value;
            activeFilters.buyer=filterBuyer.value.trim();
            activeFilters.order=filterOrder.value.trim();
            activeFilters.platform=filterPlatform.value.trim();
            renderNotes();
        };
        btnClearFilter.onclick = () => {
            filterDateFrom.value=''; filterDateTo.value='';
            filterBuyer.value=''; filterOrder.value=''; filterPlatform.value='';
            activeFilters={ dateFrom:'', dateTo:'', buyer:'', order:'', platform:'' };
            renderNotes();
        };

        loadNotes();
        renderNotes();
        noteInput.focus();
    })();
</script>
</body>
</html>
